<div class="p-4 max-w-md mx-auto">
  <main class="flex flex-col gap-4">
    <div id="user-list">
      <h1 class="text-2xl font-bold mb-4">Users</h1>

      <app-loading [loading]="loading"></app-loading>

      <div *ngIf="!loading">
        <ul *ngIf="users.length > 0; else noUsers" class="mb-8">
          <li *ngFor="let user of users" class="border p-2 my-1 rounded shadow">Name: {{ user.name }} - Age: {{ user.age }}</li>
        </ul>
      </div>

      <ng-template #noUsers>
        <p class="text-gray-500 italic">No User found</p>
      </ng-template>

      <h2 class="font-bold">Create a new User:</h2>
    </div>
    <div id="user-form">
      <form (ngSubmit)="addUser()" #userForm="ngForm" class="flex flex-col gap-2">
        <label for="name">Name: </label>
        <input [(ngModel)]="newUser.name" class="border rounded py-2 mr-2" name="name" required minlength="3" #nameInput="" ngModel />

        <label for="age">Age: </label>
        <input [(ngModel)]="newUser.age" type="number" class="border rounded py-2 mr-2" name="age" required min="1" #ageInput="" ngModel />

        <button
          type="submit"
          [disabled]="userForm.invalid"
          [ngClass]="{
            'bg-blue-500 text-white hover:bg-blue-600 cursor-pointer': !userForm.invalid,
            'bg-gray-300 text-gray-400 cursor-not-allowed': userForm.invalid
          }"
          class="px-4 py-2 rounded shadow"
        >
          Save
        </button>
      </form>
    </div>
  </main>
</div>
