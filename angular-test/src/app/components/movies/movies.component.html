<main>
  <div id="trending">
    <h2 class="text-2xl my-4">Tranding</h2>
    <div class="flex gap-4 overflow-x-auto">
      <app-tranding-movie-card *ngFor="let movie of trandingMovies; index as i" [movie]="movie" [thumbnails]="trandingThumbnails" [index]="i"></app-tranding-movie-card>
    </div>
  </div>

  <div id="recommended">
    <h2 class="text-2xl mt-8 mb-4">Recommended for you</h2>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <app-movie-card *ngFor="let movie of recomendedMovies; index as i" [movie]="movie" [thumbnails]="recomendedThumbnails" [index]="i"></app-movie-card>
    </div>
  </div>
</main>
